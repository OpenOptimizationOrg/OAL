alg_cma_es:
  type: algorithm
  name: CMA-ES
  long_name: null
  description: "pycma is a Python implementation of CMA-ES and some related numerical optimization tools.\n\nThe CMA-ES (Covariance Matrix Adaptation Evolution Strategy) is a randomized derivative-free numerical optimization algorithm for difficult (non-convex, ill-conditioned, multi-modal, rugged, noisy) optimization problems in continuous and mixed-integer search spaces. This package provides an implementation of the CMA-ES algorithm that includes the handling of\n* bound constraints via the 'bounds' = [lower, upper] option or the cma.BoundDomainTransform wrapper\n* linear and nonlinear constraints via the constraints argument to fmin2 or fmin_con2\n* noise via noise_handler=True as argument to fmin2\n* integer variables for mixed-integer problems via the 'integer_variables'=index_list option\n\nOther relevant information: There are plenty of other variants of CMA-ES"
  tags:
    - Parallel
    - Anytime
    - noisy-evaluations
    - multiple-fidelities
    - Gradient-free
    - dynamic-objective-functions
    - partial-evaluations
    - Evolutionary
    - independent-objective-evaluations
    - Population-based
    - Surrogate-based
    - multimodal
  references: null
  implementations:
    - impl_cma_es
  objectives: null
  recommended_budget:
    min: 7
    max: 10
  number_variables:
    min: 40
    max: 40
  variable_types:
    -
      type: continuous
      supports: default
      description: null
  constraint_types:
    -
      type: box
      supports: conditional
      hard: null
      equality: null
      description: null
    -
      type: linear
      supports: conditional
      hard: null
      equality: null
      description: null
  dynamics: null
  noise: null
  partial_evaluation:
    supports: no
    description: Not supported
  can_evaluate_objectives_independently:
    supports: no
    description: Not supported
  modality_types: null
  fidelity_levels: null
  code_examples: null
  source: null
